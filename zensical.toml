[project]
site_name = "supernova"
site_description = "Generate massive pre-embedded datasets, then load them into vector databases."
docs_dir = "docs"
site_dir = "site"

nav = [
  {"Home" = "index.md"},
  {"Getting Started" = "getting-started/installation.md"},
  {"Tools" = [
    {"Embed" = "embedding.md"},
    {"Brute Force" = "brute-force/overview.md"},
    {"Load" = "loading/overview.md"},
    {"Storm" = "storm/overview.md"},
    {"Sweep" = "sweep/overview.md"},
  ]},
  {"Distributed" = "distributed.md"},
  {"CLI" = "reference/cli.md"},
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
variant = "modern"
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "toc.follow",
]
